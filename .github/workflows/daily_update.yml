name: Update Observed Yesterday's Weather and Calculate SMD Value

on:
 schedule:
 # min / hour / day / month / day of week
 # target execution time: 09:30 Ireland Local Time
 - cron: '30 8 * * *' # UTC
 workflow_dispatch: # allows manual triggering of the workflow
 
jobs:
 build:
  runs-on: ubuntu-latest # uses Ubuntu virtual machine provided by Github

  steps:
  - name: Clone the repo onto the runner
    uses: actions/checkout@v3

  - name: Set up Python
    uses: actions/setup-python@v4
    with:
     python-version: '3.9'

  - name: Install Dependencies
    run: |
     python -m pip install --upgrade pip
     pip install -r requirements.txt

  - name: Run Automation Script
    env: 
      DATABASE_URL: ${{secrets.DATABASE_URL}}
    run: python backend/main.py
  
